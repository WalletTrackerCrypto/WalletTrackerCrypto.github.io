<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- WalletTracker: a glossy orb (your holdings) with an orbit and a node that tracks it. -->
  <defs>
    <radialGradient id="orb" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#fae6c7"/>
      <stop offset=".28" stop-color="#5a1f12"/>
      <stop offset=".6" stop-color="#e5392f"/>
      <stop offset=".88" stop-color="#ff8fc8"/>
      <stop offset="1" stop-color="#8c4f6e"/>
    </radialGradient>
    <radialGradient id="gloss" cx="36%" cy="26%" r="34%">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8fc8"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#5a1f12"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-24 32 32)">
    <path d="M4 32 A28 9 0 0 1 60 32" fill="none" stroke="url(#ring)" stroke-width="2.4" stroke-linecap="round" opacity=".45"/>
  </g>
  <circle cx="32" cy="32" r="19" fill="url(#orb)"/>
  <circle cx="32" cy="32" r="19" fill="url(#gloss)"/>
  <g transform="rotate(-24 32 32)">
    <path d="M60 32 A28 9 0 0 1 4 32" fill="none" stroke="url(#ring)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="46" cy="39.8" r="4.4" fill="#fff" opacity=".25"/>
    <circle cx="46" cy="39.8" r="2.7" fill="#fff"/>
  </g>
</svg>
